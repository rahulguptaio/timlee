<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies the stored color scheme before first paint; @timlee/design handles changes later. -->
    <script>
      (() => {
        const meta = document.querySelector('meta[name="color-scheme"]');
        try {
          const stored = localStorage.getItem('timlee-color-scheme');
          if (stored === 'light' || stored === 'dark') meta.content = stored;
        } catch {}
        const dark = meta.content === 'dark' || (meta.content !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'wa-dark' : 'wa-light');
      })();
    </script>
    <title>__APP_NAME__</title>
    <meta name="description" content="__APP_DESCRIPTION__" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23cc3a12'/%3E%3C/svg%3E" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__APP_NAME__" />
    <meta property="og:description" content="__APP_DESCRIPTION__" />
    <meta property="og:site_name" content="__APP_NAME__" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="__APP_NAME__" />
    <meta name="twitter:description" content="__APP_DESCRIPTION__" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>__APP_NAME__ needs JavaScript enabled.</noscript>
  </body>
</html>
